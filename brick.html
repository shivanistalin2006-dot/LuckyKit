<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Shatter - LuckyKit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="brick.css">
    <script type="module" src="core/app.js?v=2.4"></script>
        <script src="legacy/arcade-shell.js" defer></script>
</head>
<body>
    <div class="container py-4 main-wrapper d-flex flex-column align-items-center">
        <!-- Game HUD Header -->
        <div class="game-header text-center mb-3">
            <h1 class="game-title fw-black">🧱 Neon Shatter</h1>
            <p class="text-white-50 small">Move paddle using Mouse/Touch or Arrow Keys to shatter all neon bricks!</p>
        </div>

        <div class="stats-bar d-flex justify-content-between align-items-center w-100 max-w-600 mb-3 gap-2">
            <div class="score-card text-center flex-fill p-2 rounded glass-box">
                <span class="text-white-50 text-uppercase small fw-bold">Score</span>
                <h3 class="m-0 fw-black text-sky" id="score">0</h3>
            </div>
            <div class="score-card text-center flex-fill p-2 rounded glass-box">
                <span class="text-white-50 text-uppercase small fw-bold">Lives</span>
                <h3 class="m-0 fw-black text-danger" id="lives">❤️❤️❤️</h3>
            </div>
            <div class="score-card text-center flex-fill p-2 rounded glass-box">
                <span class="text-white-50 text-uppercase small fw-bold">Best</span>
                <h3 class="m-0 fw-black text-warning" id="highScore">0</h3>
            </div>
            <button class="btn btn-primary fw-bold px-3 py-2 text-uppercase shadow-btn" id="startBtn">
                ▶ Launch
            </button>
        </div>

        <!-- Canvas Game Container -->
        <div class="brick-wrapper position-relative">
            <canvas id="brickCanvas" width="600" height="500"></canvas>

            <!-- Game Over / Win Overlay -->
            <div class="overlay-screen d-flex flex-column align-items-center justify-content-center" id="overlay">
                <h2 class="fw-black fs-1 mb-2 text-sky" id="overlayTitle">Neon Shatter</h2>
                <p class="text-white-50 mb-4" id="overlaySub">Shatter every brick on the grid!</p>
                <button class="btn btn-lg btn-primary fw-bold px-5 py-3 rounded-pill shadow-btn" id="overlayStartBtn">Start Game</button>
            </div>
        </div>
    </div>

    <script type="module" src="brick.js?v=2.5"></script>
</body>
</html>
