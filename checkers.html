<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Draughts - LuckyKit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="checkers.css">
    <script type="module" src="core/app.js?v=2.3"></script>
        <script src="legacy/arcade-shell.js" defer></script>
</head>
<body>
    <div class="container py-4 main-wrapper d-flex flex-column align-items-center">
        <!-- Game HUD Header -->
        <div class="game-header text-center mb-3">
            <h1 class="game-title fw-black">♟️ Neo Draughts</h1>
            <p class="text-white-50 small">Click piece to highlight valid moves. Jump opponent pieces to win!</p>
        </div>

        <div class="stats-bar d-flex justify-content-between align-items-center w-100 max-w-500 mb-3 gap-2">
            <div class="score-card text-center flex-fill p-2 rounded glass-box">
                <span class="text-white-50 text-uppercase small fw-bold">Turn</span>
                <h4 class="m-0 fw-black text-info" id="turnIndicator">Player (Red)</h4>
            </div>
            <div class="score-card text-center flex-fill p-2 rounded glass-box">
                <span class="text-white-50 text-uppercase small fw-bold">Captures</span>
                <h4 class="m-0 fw-black text-warning" id="scoreDisplay">0 - 0</h4>
            </div>
            <button class="btn btn-light fw-bold px-3 py-2 text-uppercase shadow-btn" id="restartBtn">
                🔄 Reset
            </button>
        </div>

        <!-- Checkers Board -->
        <div class="checkers-wrapper position-relative">
            <div id="checkersBoard" class="checkers-board"></div>

            <!-- Game Over Overlay -->
            <div class="overlay-screen d-none flex-column align-items-center justify-content-center" id="overlay">
                <h2 class="fw-black fs-1 mb-2 text-warning" id="overlayTitle">Victory!</h2>
                <p class="text-white-50 mb-4" id="overlaySub">Red player dominates the board.</p>
                <button class="btn btn-lg btn-light fw-bold px-5 py-3 rounded-pill shadow-btn" id="overlayRestartBtn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="checkers.js"></script>
</body>
</html>
