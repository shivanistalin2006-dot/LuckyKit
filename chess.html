<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyKit - Grandmaster's Gambit</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="chess.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700" rel="stylesheet">
    
    <script type="module" src="core/app.js?v=2.4"></script>
        <script type="module" src="chess.js?v=2.5" defer></script>
</head>
<body class="bg-dark text-white premium-bg-chess">

    <div class="bg-overlay"></div>
    <div class="particle-container" id="particles"></div>

    <div class="container py-4 position-relative" style="z-index: 10;">
        
        <header class="d-flex justify-content-between align-items-center mb-4 p-3 rounded glass-panel">
            <div class="d-flex align-items-center gap-3">
                <span class="fs-1">♔</span>
                <div>
                    <h1 class="m-0 fw-bold text-theme">Grandmaster's Gambit</h1>
                    <span class="text-white-50">Tactical AI Chess</span>
                </div>
            </div>
            <div>
                <button class="btn btn-outline-light" id="restartBtn">NEW MATCH</button>
            </div>
        </header>

        <div class="row g-4 justify-content-center">
            
            <div class="col-12 col-lg-8 d-flex flex-column align-items-center">
                <div class="glass-panel p-3 rounded w-100 d-flex flex-column align-items-center position-relative">
                    
                    <div class="chess-board" id="chessBoard">
                        <!-- Cells injected by JS -->
                    </div>

                </div>
            </div>

            <!-- Stats & Status -->
            <div class="col-12 col-lg-4">
                <div class="glass-panel p-4 rounded h-100 d-flex flex-column gap-3">
                    <h4 class="text-theme border-bottom border-secondary pb-2">Match Status</h4>
                    
                    <div class="d-flex justify-content-center align-items-center my-3">
                        <div class="text-center p-3 rounded w-100 turn-indicator" id="turnIndicator">
                            <h3 class="m-0" id="statusMsg">White's Turn</h3>
                            <span class="small text-white-50" id="subStatusMsg">Select a piece</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3 p-2 bg-dark rounded border border-light">
                        <span class="fs-5 text-light fw-bold">White (You)</span>
                        <div class="captured-pieces text-light" id="whiteCaptured"></div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mt-2 p-2 bg-dark rounded border" style="border-color: #000 !important;">
                        <span class="fs-5 fw-bold" style="color: #94a3b8;">Black (AI)</span>
                        <div class="captured-pieces" style="color: #94a3b8;" id="blackCaptured"></div>
                    </div>

                    <div class="mt-auto pt-3 border-top border-secondary text-center">
                        <p class="small text-white-50 mb-0">Powered by LuckyKit Core Engine</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
