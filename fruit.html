<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Ninja - LuckyKit</title>
    <link rel="stylesheet" href="fruit.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    
    <!-- LuckyKit Arcade Premium Injections -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <script type="module" src="core/app.js?v=2.2"></script>
        <script src="legacy/arcade-shell.js" defer></script>
</head>
<body>

<!-- Animated Background Canvas -->
<canvas id="bgCanvas"></canvas>

<!-- Game Overlays and UI -->
<div class="hud">
    <div class="hud-box">
        <span>⭐ Score</span>
        <h2 id="score">0</h2>
    </div>
    <div class="hud-box">
        <span>❤️ Lives</span>
        <h2 id="lives">3</h2>
    </div>
    <div class="hud-box">
        <span>🏆 High Score</span>
        <h2 id="highScore">0</h2>
    </div>
</div>

<!-- Game Area -->
<canvas id="gameCanvas"></canvas>

<!-- Start Overlay -->
<div id="startScreen" class="overlay">
    <h2>🍉 Fruit Ninja</h2>
    <p style="color: #cbd5e1; font-size: 1.2rem; margin-bottom: 30px;">Slice fruits • Avoid bombs</p>
    <button id="startBtn">▶ Play Now</button>
</div>

<!-- Game Over Overlay -->
<div id="gameOverScreen" class="overlay hidden">
    <h2>💀 Game Over</h2>
    <h3 style="color: #fff; font-size: 2rem; margin-bottom: 20px;">
        Final Score: <span id="finalScore" style="color: #facc15;">0</span>
    </h3>
    <button id="restartBtn">🔄 Play Again</button>
</div>

<!-- Only ONE script file now -->
<script src="fruit.js"></script>

    

</body>
</html>
