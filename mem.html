<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyKit - Memory Match</title>
    <link rel="stylesheet" href="mem.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700" rel="stylesheet">

    
    <!-- LuckyKit Arcade Premium Injections -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <script type="module" src="core/app.js?v=2.4"></script>
        <script src="legacy/arcade-shell.js" defer></script>
</head>
<body>
    <div class="background-animation"></div>
    <div class="stars"></div>
    <div class="floating-shapes"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>🧠🎴 Memory Match</h1>
            <p>
                Match all cards as fast as possible!
            </p>
        
</header>

        <!-- Stats -->
        <section class="stats">
            <div class="stat-card">
                <h3>⏱️ Time</h3>
                <p id="timer">0s</p>
            </div>
            <div class="stat-card">
                <h3>🎯 Moves</h3>
                <p id="moves">0</p>
            </div>
            <div class="stat-card">
                <h3>✅ Matches</h3>
                <p id="matches">0</p>
            </div>
        </section>

        <!-- Result Text -->
        <section class="result-section">
            <h2 id="resultText">
                Find all matching pairs!
            </h2>
        </section>

        <!-- Game Board -->
        <section class="board-section">
            <div id="gameBoard" class="game-board">
                <!-- JS creates cards here -->
            </div>
        </section>

        <!-- Overlay -->
        <div id="gameOverlay" class="overlay">
            <div class="overlay-content">
                <h2 id="overlayTitle">Synapse Match</h2>
                <p id="overlayMessage">Find all matching pairs as fast as possible!</p>
                <button id="overlayBtn">Start Game</button>
            </div>
        </div>

        <!-- Controls -->
        <section class="controls">
            <button id="restartBtn">
                🔄 Restart Game
            </button>
            
        </section>

        <!-- Footer -->
        <footer>
            <p>
                ✨ Created by Shivani Stalin & Vaishnavi M ✨
            </p>
        </footer>
    </div>

    <script src="mem.js?v=2.5"></script>

    

</body>
</html>
