<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyKit - Synapse Match</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="memory.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700" rel="stylesheet">
    
    <script type="module" src="core/app.js?v=2.4"></script>
        <script type="module" src="memory.js?v=2.5" defer></script>
</head>
<body class="bg-dark text-white premium-bg-memory">

    <!-- Floating HUB Button -->
    <div class="position-fixed top-0 start-0 p-3" style="z-index: 9999;">
        <button id="hubBtn" class="btn btn-sm btn-dark border border-danger text-danger fw-bold px-3 py-2 rounded-pill shadow-lg"
            onclick="window.location.href='index.html'"
            style="backdrop-filter: blur(10px); background: rgba(25, 15, 15, 0.85) !important;">
            ⬅ HUB
        </button>
    </div>

    <div class="bg-overlay"></div>
    <div class="particle-container" id="particles"></div>

    <div class="container py-4 position-relative" style="z-index: 10;">
        
        <header class="d-flex justify-content-between align-items-center mb-4 p-3 rounded glass-panel">
            <div class="d-flex align-items-center gap-3">
                <span class="fs-1">🧠</span>
                <div>
                    <h1 class="m-0 fw-bold text-theme">Synapse Match (Memory)</h1>
                    <span class="text-white-50">Memory Card Protocol</span>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-theme fw-bold px-3" id="startBtn">▶ START MATCH</button>
                <button class="btn btn-outline-light fw-bold" id="restartBtn">RESTART</button>
            </div>
        </header>

        <div class="row g-4 justify-content-center">
            
            <div class="col-12 col-lg-8 d-flex flex-column align-items-center">
                <div class="glass-panel p-4 rounded w-100 d-flex flex-column align-items-center position-relative">
                    
                    <div class="d-flex justify-content-between w-100 mb-3 px-3 py-2 bg-dark rounded border border-secondary" style="max-width: 600px;">
                        <span class="fs-5 text-white-50">Matches: <span class="fw-bold text-success" id="matchesDisplay">0</span></span>
                        <span class="fs-5 text-white-50">Moves: <span class="fw-bold text-info" id="movesDisplay">0</span></span>
                    </div>

                    <div class="memory-board w-100" id="memoryBoard" style="max-width: 600px;">
                        <!-- Cards injected by JS -->
                    </div>

                </div>
            </div>

            <!-- Stats & Status -->
            <div class="col-12 col-lg-4">
                <div class="glass-panel p-4 rounded h-100 d-flex flex-column gap-3">
                    <h4 class="text-theme border-bottom border-secondary pb-2">Diagnostics</h4>
                    
                    <p class="text-center mt-3 fs-5" id="statusMsg">Initialize memory sequence...</p>

                    <div class="mt-3">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-white-50">Best (Fewest Moves)</span>
                            <span class="text-theme fw-bold" id="hsMovesDisplay">---</span>
                        </div>
                    </div>
                    
                    <div class="mt-4 p-3 rounded" style="background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2);">
                        <h6 class="text-white-50 mb-2">Instructions:</h6>
                        <p class="small text-white-50 mb-0">Tap cards to flip them. Match all pairs in the fewest moves possible.</p>
                    </div>

                    <div class="mt-auto pt-3 border-top border-secondary text-center">
                        <p class="small text-white-50 mb-0">Powered by LuckyKit Core Engine</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
