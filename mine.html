<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyKit - Grid Sweeper</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="mine.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700" rel="stylesheet">
    
    <script type="module" src="core/app.js?v=2.4"></script>
        <script type="module" src="mine.js?v=2.5" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Caveat:wght@700&family=Kaushan+Script&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-white premium-bg-mine">

    <!-- Floating HUB Button -->
    <div class="position-fixed top-0 start-0 p-3" style="z-index: 9999;">
        <button id="hubBtn" class="btn btn-sm btn-dark border border-danger text-danger fw-bold px-3 py-2 rounded-pill shadow-lg"
            onclick="window.location.href='index.html'"
            style="backdrop-filter: blur(10px); background: rgba(15, 15, 25, 0.85) !important;">
            ⬅ HUB
        </button>
    </div>

    <div class="bg-overlay"></div>
    <div class="particle-container" id="particles"></div>

    <div class="container py-4 position-relative" style="z-index: 10;">
        
        <header class="d-flex justify-content-between align-items-center mb-4 p-3 rounded glass-panel">
            <div class="d-flex align-items-center gap-3">
                <span class="fs-1">💣</span>
                <div>
                    <h1 class="m-0 fw-bold text-theme">Grid Sweeper (Minesweeper)</h1>
                    <span class="text-white-50">Premium Tactical Sweeper</span>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-theme fw-bold px-3" id="startBtn">▶ START SWEEP</button>
                <button class="btn btn-outline-light fw-bold" id="restartBtn">RESTART</button>
            </div>
        </header>

        <div class="row g-4 justify-content-center">
            
            <div class="col-12 col-lg-8 d-flex justify-content-center">
                <div class="glass-panel p-4 rounded w-100 d-flex flex-column align-items-center">
                    
                    <!-- Top HUD -->
                    <div class="d-flex justify-content-between align-items-center w-100 mb-4 px-3 py-2 rounded bg-dark border border-secondary" style="max-width: 500px;">
                        <div class="d-flex align-items-center gap-2">
                            <span class="fs-4 text-danger">🚩</span>
                            <span class="fs-4 fw-bold text-danger" id="flagCount">10</span>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="fs-4 text-info">⏱️</span>
                            <span class="fs-4 fw-bold text-info" id="timeCount">000</span>
                        </div>
                    </div>

                    <!-- Mine Board -->
                    <div class="mine-board-wrapper" style="width: 100%; max-width: 500px; aspect-ratio: 1/1;" oncontextmenu="return false;">
                        <div class="mine-board w-100 h-100" id="mineBoard">
                            <!-- Cells injected by JS -->
                        </div>
                    </div>

                </div>
            </div>

            <!-- Stats & Status -->
            <div class="col-12 col-lg-4">
                <div class="glass-panel p-4 rounded h-100 d-flex flex-column gap-3">
                    <h4 class="text-theme border-bottom border-secondary pb-2">Mission Status</h4>
                    
                    <p class="text-center mt-4 fs-5" id="statusMsg">Sweep the grid. Avoid EMPs.</p>

                    <div class="mt-4 p-3 rounded" style="background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2);">
                        <h6 class="text-white-50 mb-2">Controls:</h6>
                        <ul class="mb-0 small text-white-50">
                            <li><strong>Tap/Click:</strong> Reveal Cell</li>
                            <li><strong>Long-Press/Right-Click:</strong> Place Flag 🚩</li>
                        </ul>
                    </div>
                    
                    <div class="mt-auto pt-3 border-top border-secondary text-center">
                        <p class="small text-white-50 mb-0">Powered by LuckyKit Core Engine</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
