<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyKit - Reflex Protocol</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="react.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700" rel="stylesheet">
    
    <script type="module" src="core/app.js?v=2.4"></script>
    <script src="legacy/arcade-shell.js" defer></script>
    <script type="module" src="react.js?v=2.5" defer></script>
</head>
<body class="bg-dark text-white premium-bg-react">

    <div class="bg-overlay"></div>
    <div class="particle-container" id="particles"></div>

    <div class="container py-4 position-relative d-flex flex-column h-100" style="z-index: 10; min-height: 100vh;">
        
        <header class="d-flex justify-content-between align-items-center mb-4 p-3 rounded glass-panel">
            <div class="d-flex align-items-center gap-3">
                <span class="fs-1">⚡</span>
                <div>
                    <h1 class="m-0 fw-bold text-theme">Reflex Protocol</h1>
                    <span class="text-white-50">Reaction Time Test</span>
                </div>
            </div>
            <div>
                <button class="btn btn-outline-light d-none" id="restartBtn">TRY AGAIN</button>
            </div>
        </header>

        <div class="row g-4 flex-grow-1 justify-content-center">
            
            <div class="col-12 col-lg-8 d-flex flex-column">
                <div class="glass-panel p-4 rounded w-100 flex-grow-1 d-flex flex-column align-items-center justify-content-center position-relative">
                    
                    <div id="tapArea" class="tap-area w-100 h-100 rounded d-flex flex-column align-items-center justify-content-center state-idle">
                        <span class="display-1 fw-bold mb-3" id="stateIcon">⚡</span>
                        <h2 class="display-4 fw-black text-white text-center" id="mainText">Tap to Start</h2>
                        <p class="fs-4 text-white-50 text-center mt-2" id="subText">When the red box turns green, tap as quickly as you can.</p>
                    </div>

                </div>
            </div>

            <!-- Stats & Status -->
            <div class="col-12 col-lg-4">
                <div class="glass-panel p-4 rounded h-100 d-flex flex-column gap-3">
                    <h4 class="text-theme border-bottom border-secondary pb-2">Diagnostics</h4>
                    
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="text-white-50">Attempt</span>
                        <h3 class="m-0 fw-bold text-info"><span id="attemptCount">0</span> / 5</h3>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="text-white-50">Last Try</span>
                        <h3 class="m-0 fw-bold text-warning" id="lastTimeDisplay">--- ms</h3>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="text-white-50">Average Time</span>
                        <h3 class="m-0 fw-bold text-success" id="avgTimeDisplay">--- ms</h3>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mt-2 pt-3 border-top border-secondary">
                        <span class="text-white-50">Personal Best</span>
                        <h3 class="m-0 fw-bold text-theme" id="pbDisplay">--- ms</h3>
                    </div>

                    <div class="mt-auto pt-3 border-top border-secondary text-center">
                        <p class="small text-white-50 mb-0">Powered by LuckyKit Core Engine</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
