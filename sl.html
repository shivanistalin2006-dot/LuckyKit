<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serpent's Ascent</title>
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="sl.css">
    <script type="module" src="core/app.js?v=2.4"></script>
            <script type="module" src="sl.js?v=2.5"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Space+Grotesk:wght@600;700&family=Rajdhani:wght@600;700;800&family=STIX+Two+Text:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    

    <div class="container py-4 position-relative" style="z-index: 10;">
        <header class="d-flex justify-content-between align-items-center mb-4 p-3 rounded glass-panel">
            <div class="d-flex align-items-center gap-3">
                <span class="fs-1">🪜</span>
                <div>
                    <h1 class="m-0 fw-bold text-success">Neon Ladders</h1>
                    <span class="text-white-50">Snakes & Ladders AI Race</span>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-success fw-bold px-3" id="startBtn">▶ START GAME</button>
                <button class="btn btn-outline-light fw-bold" id="restartBtn">RESTART</button>
            
                <a href="index.html" class="btn btn-theme fw-bold px-3 py-2 rounded-pill shadow-sm text-decoration-none">🏠 HOME</a></div>
        </header>
        
        <div class="game-layout">
            <div class="board-container">
                <div id="board" class="board"></div>
            </div>
            
            <div class="side-panel">
                <div class="info-box p1 active" id="p1-info">Player (Green)</div>
                <div class="info-box p2" id="p2-info">AI (Purple)</div>
                
                <div class="dice-scene">
                    <div class="cube" id="dice">
                        <div class="cube-face front">1</div>
                        <div class="cube-face back">6</div>
                        <div class="cube-face right">3</div>
                        <div class="cube-face left">4</div>
                        <div class="cube-face top">2</div>
                        <div class="cube-face bottom">5</div>
                    </div>
                </div>
                
                <button id="roll-btn" class="btn roll-btn">Roll Dice</button>
                <div id="action-text" class="action-text">Roll to start!</div>
            </div>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h2 id="winner-text"></h2>
            <button id="restart-btn" class="btn">Play Again</button>
        </div>
    </div>
</body>
</html>
