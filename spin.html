<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Vortex</title>
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="spin.css">
    <script type="module" src="core/app.js?v=2.4"></script>
            <script src="spin.js?v=2.5" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Space+Grotesk:wght@600;700&family=Rajdhani:wght@600;700;800&family=STIX+Two+Text:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h1 class="game-title">Fortune Vortex</h1>
        <div class="game-area">
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
            <div class="pointer">▼</div>
            <button id="spinBtn" class="action-btn">SPIN</button>
            <div id="overlay" class="overlay hidden">
                <h2 id="resultMsg"></h2>
                <button id="closeOverlayBtn" class="action-btn">Close</button>
            </div>
        </div>
    </div>
</body>
</html>
