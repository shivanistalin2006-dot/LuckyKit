<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Vortex</title>
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="spin.css">
    <script type="module" src="core/app.js"></script>
        <script src="legacy/arcade-shell.js" defer></script>
    <script src="spin.js" defer></script>
</head>
<body>
    <div class="container py-4">
        <h1 class="game-title">Fortune Vortex</h1>
        <div class="game-area">
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
            <div class="pointer">▼</div>
            <button id="spinBtn" class="action-btn">SPIN</button>
            <div id="overlay" class="overlay hidden">
                <h2 id="resultMsg"></h2>
                <button id="closeOverlayBtn" class="action-btn">Close</button>
            </div>
        </div>
    </div>
</body>
</html>
