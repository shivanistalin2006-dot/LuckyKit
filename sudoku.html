<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyKit - Logic Grid (Sudoku)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="sudoku.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700" rel="stylesheet">
    
    <script type="module" src="core/app.js?v=2.4"></script>
        <script type="module" src="sudoku.js?v=2.5" defer></script>
</head>
<body class="bg-dark text-white premium-bg-sudoku">

    <div class="bg-overlay"></div>
    <div class="particle-container" id="particles"></div>

    <div class="container py-4 position-relative" style="z-index: 10;">
        
        <header class="d-flex justify-content-between align-items-center mb-4 p-3 rounded glass-panel">
            <div class="d-flex align-items-center gap-3">
                <span class="fs-1">🧩</span>
                <div>
                    <h1 class="m-0 fw-bold text-theme">Logic Grid</h1>
                    <span class="text-white-50">Premium Sudoku</span>
                </div>
            </div>
            <div>
                <button class="btn btn-outline-light" id="restartBtn">NEW PUZZLE</button>
            </div>
        </header>

        <div class="row g-4 justify-content-center">
            
            <div class="col-12 col-lg-7 d-flex justify-content-center">
                <div class="glass-panel p-4 rounded w-100 d-flex flex-column align-items-center">
                    
                    <div class="d-flex justify-content-between w-100 mb-3 px-2">
                        <span class="text-white-50">Difficulty: <strong class="text-white">Medium</strong></span>
                        <span class="text-white-50">Mistakes: <strong class="text-danger" id="mistakeCount">0/3</strong></span>
                    </div>

                    <div class="sudoku-board" id="sudokuBoard">
                        <!-- 81 cells generated by JS -->
                    </div>

                </div>
            </div>

            <div class="col-12 col-lg-5">
                <div class="glass-panel p-4 rounded h-100 d-flex flex-column gap-3">
                    <h4 class="text-theme border-bottom border-secondary pb-2">Number Pad</h4>
                    <p class="text-white-50 mb-4 text-center">Tap a cell, then tap a number below.</p>
                    
                    <div class="numpad grid-3x3 mx-auto" id="numpad">
                        <button class="num-btn">1</button>
                        <button class="num-btn">2</button>
                        <button class="num-btn">3</button>
                        <button class="num-btn">4</button>
                        <button class="num-btn">5</button>
                        <button class="num-btn">6</button>
                        <button class="num-btn">7</button>
                        <button class="num-btn">8</button>
                        <button class="num-btn">9</button>
                        <button class="num-btn action-btn bg-danger" id="eraseBtn">X</button>
                    </div>
                    
                    <div class="mt-4 text-center">
                        <p class="fs-5 text-success d-none" id="statusMsg">Puzzle Complete!</p>
                    </div>

                    <div class="mt-auto pt-3 border-top border-secondary text-center">
                        <p class="small text-white-50 mb-0">Powered by LuckyKit Core Engine</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
