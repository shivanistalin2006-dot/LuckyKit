<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyKit - Midnight Runner</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="truck.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <script type="module" src="core/app.js?v=2.2"></script>
    <script src="legacy/arcade-shell.js" defer></script>
    <script type="module" src="truck.js" defer></script>
</head>
<body class="bg-dark text-white premium-bg-runner">

    <div class="bg-overlay"></div>
    <!-- No particle container here, handled by game canvas if needed -->

    <div class="container py-4 position-relative" style="z-index: 10;">
        
        <header class="d-flex justify-content-between align-items-center mb-4 p-3 rounded glass-panel">
            <div class="d-flex align-items-center gap-3">
                <span class="fs-1">🏍️</span>
                <div>
                    <h1 class="m-0 fw-bold text-theme">Midnight Runner</h1>
                    <span class="text-white-50">Cyberpunk Survival</span>
                </div>
            </div>
            <div>
                <button class="btn btn-outline-light" id="restartBtn">NEW RUN</button>
            </div>
        </header>

        <div class="row g-4 justify-content-center">
            
            <div class="col-12 col-lg-9 d-flex flex-column align-items-center">
                <div class="glass-panel p-2 rounded w-100 d-flex flex-column align-items-center position-relative">
                    
                    <div class="d-flex justify-content-between w-100 mb-2 px-4 py-2 bg-dark rounded border border-secondary">
                        <div class="text-center">
                            <span class="d-block text-white-50 small">SCORE</span>
                            <span class="fs-3 fw-bold text-success" id="scoreDisplay">0</span>
                        </div>
                        <div class="text-center">
                            <span class="d-block text-white-50 small">HIGH SCORE</span>
                            <span class="fs-3 fw-bold text-theme" id="hsDisplay">0</span>
                        </div>
                        <div class="text-center">
                            <span class="d-block text-white-50 small">SPEED</span>
                            <span class="fs-3 fw-bold text-warning" id="speedDisplay">1.0x</span>
                        </div>
                    </div>

                    <!-- Game Container -->
                    <div class="runner-container position-relative w-100 rounded overflow-hidden" id="runnerContainer" style="height: 350px; background: #000; box-shadow: inset 0 0 50px rgba(0,0,0,0.8);">
                        <!-- Parallax Backgrounds -->
                        <div class="bg-layer bg-sky" id="bgSky"></div>
                        <div class="bg-layer bg-city-back" id="bgCityBack"></div>
                        <div class="bg-layer bg-city-front" id="bgCityFront"></div>
                        <div class="bg-layer bg-road" id="bgRoad"></div>

                        <!-- Game Canvas for Entities -->
                        <canvas id="runnerCanvas" class="w-100 h-100 position-absolute top-0 left-0" style="z-index: 5;"></canvas>

                        <!-- UI Overlay -->
                        <div class="position-absolute w-100 h-100 top-0 left-0 d-flex justify-content-center align-items-center d-none" id="gameOverOverlay" style="z-index: 10; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);">
                            <div class="text-center">
                                <h1 class="text-danger fw-bold display-3">CRASHED</h1>
                                <p class="text-white-50 fs-5" id="finalScoreMsg">Distance: 0m</p>
                                <button class="btn btn-theme btn-lg mt-3" id="tryAgainBtn">TRY AGAIN</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="w-100 text-center mt-2 d-lg-none">
                        <p class="small text-white-50 m-0">Tap anywhere on the game area to jump.</p>
                    </div>

                </div>
            </div>

            <!-- Stats & Status -->
            <div class="col-12 col-lg-3">
                <div class="glass-panel p-4 rounded h-100 d-flex flex-column gap-3">
                    <h4 class="text-theme border-bottom border-secondary pb-2">Status</h4>
                    
                    <p class="text-center mt-3 fs-5" id="statusMsg">Ready to ride.</p>

                    <div class="mt-4 p-3 rounded" style="background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2);">
                        <h6 class="text-white-50 mb-2">Controls:</h6>
                        <ul class="mb-0 small text-white-50">
                            <li><strong>Space/Up:</strong> Jump</li>
                            <li><strong>Tap:</strong> Jump (Mobile)</li>
                        </ul>
                    </div>

                    <div class="mt-auto pt-3 border-top border-secondary text-center">
                        <p class="small text-white-50 mb-0">Powered by LuckyKit Core Engine</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
