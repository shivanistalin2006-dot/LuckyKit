<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyKit - Cyber Typer</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="type.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    
    <script type="module" src="core/app.js?v=2.2"></script>
    <script src="legacy/arcade-shell.js" defer></script>
    <script type="module" src="type.js" defer></script>
</head>
<body class="bg-dark text-white premium-bg-type">

    <div class="bg-overlay"></div>
    <div class="particle-container" id="particles"></div>

    <div class="container py-4 position-relative" style="z-index: 10;">
        
        <header class="d-flex justify-content-between align-items-center mb-4 p-3 rounded glass-panel">
            <div class="d-flex align-items-center gap-3">
                <span class="fs-1">⌨️</span>
                <div>
                    <h1 class="m-0 fw-bold text-theme">Cyber Typer</h1>
                    <span class="text-white-50">Terminal Speed Test</span>
                </div>
            </div>
            <div>
                <button class="btn btn-outline-light" id="restartBtn">NEW TEST</button>
            </div>
        </header>

        <div class="row g-4 justify-content-center">
            
            <div class="col-12 col-lg-9 d-flex justify-content-center">
                <div class="glass-panel p-4 p-md-5 rounded w-100 d-flex flex-column align-items-center">
                    
                    <!-- HUD -->
                    <div class="d-flex justify-content-between align-items-center w-100 mb-4 px-4 py-3 rounded bg-dark border border-secondary" style="max-width: 800px;">
                        <div class="text-center">
                            <span class="d-block text-white-50 small">WPM</span>
                            <span class="fs-2 fw-bold text-success" id="wpmDisplay">0</span>
                        </div>
                        <div class="text-center">
                            <span class="d-block text-white-50 small">TIME</span>
                            <span class="fs-2 fw-bold text-info" id="timeDisplay">60</span>
                        </div>
                        <div class="text-center">
                            <span class="d-block text-white-50 small">ACCURACY</span>
                            <span class="fs-2 fw-bold text-warning" id="accDisplay">100%</span>
                        </div>
                    </div>

                    <!-- Typing Area -->
                    <div class="type-container position-relative w-100" style="max-width: 800px;">
                        <!-- Hidden input to capture mobile keyboard and desktop focus -->
                        <input type="text" id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="position-absolute opacity-0" style="left: -9999px;">
                        
                        <div id="textDisplay" class="terminal-text fs-4 lh-base text-start w-100 p-4 rounded bg-dark border border-secondary" style="min-height: 200px;">
                            Click to start typing...
                        </div>
                        
                        <div class="text-center mt-3 d-lg-none">
                            <p class="small text-white-50">Tap the text box above to open your keyboard.</p>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Stats & Status -->
            <div class="col-12 col-lg-3">
                <div class="glass-panel p-4 rounded h-100 d-flex flex-column gap-3">
                    <h4 class="text-theme border-bottom border-secondary pb-2">Metrics</h4>
                    
                    <p class="text-center mt-3 fs-6" id="statusMsg">Waiting for first keystroke...</p>

                    <div class="mt-3">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-white-50">High Score WPM</span>
                            <span class="text-theme fw-bold" id="hsWpmDisplay">0</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-white-50">Total Words</span>
                            <span class="text-info fw-bold" id="totalWordsDisplay">0</span>
                        </div>
                    </div>
                    
                    <div class="mt-auto pt-3 border-top border-secondary text-center">
                        <p class="small text-white-50 mb-0">Powered by LuckyKit Core Engine</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
