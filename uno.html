<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyKit - Cosmic Cards</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <link rel="stylesheet" href="uno.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700" rel="stylesheet">
    
    <script type="module" src="core/app.js?v=2.4"></script>
        <script type="module" src="uno.js?v=2.5" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Caveat:wght@700&family=Kaushan+Script&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-white premium-bg-uno">

    <!-- Floating HUB Button -->
    <div class="position-fixed top-0 start-0 p-3" style="z-index: 9999;">
        <button id="hubBtn" class="btn btn-sm btn-dark border border-warning text-warning fw-bold px-3 py-2 rounded-pill shadow-lg"
            onclick="window.location.href='index.html'"
            style="backdrop-filter: blur(10px); background: rgba(15, 15, 25, 0.85) !important;">
            ⬅ HUB
        </button>
    </div>

    <!-- Dynamic Background -->
    <div class="bg-overlay"></div>
    <div class="particle-container" id="particles"></div>

    <div class="container py-4 position-relative" style="z-index: 10;">
        
        <!-- Header -->
        <header class="d-flex justify-content-between align-items-center mb-4 p-3 rounded glass-panel">
            <div class="d-flex align-items-center gap-3">
                <span class="fs-1">🃏</span>
                <div>
                    <h1 class="m-0 fw-bold text-theme">Cosmic Cards (UNO)</h1>
                    <span class="text-white-50">Premium Edition (1v3 AI)</span>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-theme fw-bold px-3" id="startBtn">▶ START GAME</button>
                <button class="btn btn-outline-light fw-bold" id="restartBtn">RESTART</button>
            </div>
        </header>

        <!-- Game Interface -->
        <div class="row g-4 justify-content-center">
            <div class="col-12 col-lg-9">
                <div class="glass-panel p-4 rounded text-center min-vh-75 d-flex flex-column" id="gameArea">
                    
                    <!-- Top AI -->
                    <div class="ai-player top-ai mb-auto">
                        <span class="badge bg-secondary mb-2" id="ai2-name">AI 2 (Yellow)</span>
                        <div class="card-hand ai-hand" id="ai2-hand"></div>
                    </div>

                    <!-- Middle Area: Pile and Side AIs -->
                    <div class="d-flex justify-content-between align-items-center my-4 w-100 position-relative">
                        <!-- Left AI -->
                        <div class="ai-player side-ai left-ai">
                            <span class="badge bg-secondary mb-2" id="ai1-name">AI 1 (Green)</span>
                            <div class="card-hand ai-hand vertical" id="ai1-hand"></div>
                        </div>

                        <!-- Center Play Area -->
                        <div class="play-area d-flex gap-4 justify-content-center">
                            <div class="draw-pile card-slot" id="drawPile">
                                <div class="uno-card back">UNO</div>
                            </div>
                            <div class="discard-pile card-slot" id="discardPile">
                                <!-- Top card injected via JS -->
                            </div>
                        </div>
                        
                        <!-- Direction Arrow -->
                        <div class="direction-indicator" id="directionIndicator">↻</div>

                        <!-- Right AI -->
                        <div class="ai-player side-ai right-ai">
                            <span class="badge bg-secondary mb-2" id="ai3-name">AI 3 (Blue)</span>
                            <div class="card-hand ai-hand vertical" id="ai3-hand"></div>
                        </div>
                    </div>

                    <!-- Bottom Player (Human) -->
                    <div class="human-player mt-auto pt-4 border-top border-secondary position-relative">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-theme fs-6" id="player-name">You (Red)</span>
                            <button class="btn btn-sm btn-warning fw-bold d-none" id="unoCallBtn">CALL UNO!</button>
                        </div>
                        <div class="card-hand player-hand" id="player-hand"></div>
                    </div>

                </div>
            </div>

            <!-- Stats & Status -->
            <div class="col-12 col-lg-3">
                <div class="glass-panel p-4 rounded h-100 d-flex flex-column gap-3">
                    <h4 class="text-theme border-bottom border-secondary pb-2">Status</h4>
                    
                    <div class="turn-indicator mb-3 p-3 rounded text-center fw-bold fs-4" id="turnDisplay" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444;">
                        Your Turn!
                    </div>
                    
                    <p class="text-center mt-2 text-white-50" id="actionText">Game starting...</p>

                    <div class="color-picker-overlay d-none" id="colorPicker">
                        <h5 class="text-center mb-3">Choose Color</h5>
                        <div class="d-flex flex-wrap gap-2 justify-content-center">
                            <button class="color-btn bg-danger" data-color="red"></button>
                            <button class="color-btn bg-success" data-color="green"></button>
                            <button class="color-btn bg-primary" data-color="blue"></button>
                            <button class="color-btn bg-warning" data-color="yellow"></button>
                        </div>
                    </div>

                    <div class="mt-auto pt-3 border-top border-secondary text-center">
                        <p class="small text-white-50 mb-0">Powered by LuckyKit Core Engine</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over-screen" class="overlay hidden">
            <h1 class="display-1 fw-bold mb-4" id="winner-text" style="text-shadow: 0 0 20px #fff;">YOU WIN!</h1>
            <button id="play-again-btn" class="btn btn-lg btn-light fw-bold px-5 py-3 shadow-lg">PLAY AGAIN</button>
        </div>

    </div>
</body>
</html>
