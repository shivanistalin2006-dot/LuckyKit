<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack A Mole - LuckyKit</title>

    <link rel="stylesheet" href="whack.css">

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700" rel="stylesheet">

    
    <!-- LuckyKit Arcade Premium Injections -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="arcade-shell.css">
    <script type="module" src="core/app.js?v=2.4"></script>
            <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Caveat:wght@700&family=Kaushan+Script&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <header>
            <h1>🔨 Whack A Mole</h1>
            <p>Hit the mole before it disappears!</p>
        
</header>

        <div class="game-info">

            <div class="info-box">
                <h2>Score</h2>
                <span id="score">0</span>
            </div>

            <div class="info-box">
                <h2>Time</h2>
                <span id="time">30</span>
            </div>

        </div>

        <div class="grid">

            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>

            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>

            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>

        </div>

        <div class="buttons">

            <button id="startBtn">
                ▶ Start Game
            </button>

            

        </div>

        <div id="gameOver" class="game-over hidden">
            <div class="game-over-content">
                <h2>🎉 Game Over!</h2>
                <p>
                    Final Score:
                    <span id="finalScore">0</span>
                </p>
                <button id="playAgainBtn">🔄 Play Again</button>
            </div>
        </div>

        <footer>
            <p class="creator">
                ✨ Created by Shivani Stalin & Vaishnavi M ✨
            </p>
        </footer>

    </div>

    <script src="whack.js?v=2.5"></script>


    

</body>
</html>
